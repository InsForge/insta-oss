name: ci

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # has Docker: integration tests run for real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          RUN_DOCKER_TESTS: '1'
          INSTA_OSS_SCHEDULER: '0'
      # ---- WP4 ----
      # ---- WP6 ----
      - run: shellcheck -s sh install.sh
      - run: docker build --build-arg VERSION=ci -t instacloud:ci .
