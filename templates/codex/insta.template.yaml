code: codex
version: 0.6.0
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: openai/codex
  package: "@openai/codex"
  pinned: "0.148.0"
  license: Apache-2.0

services:
  # Named for the template, not "workspace": three templates sharing one service name collided on
  # the same branch, the second overwriting the first (QA.md finding 1).
  codex:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/codex:0.6.0   # built from ./Dockerfile by templates-build-images.yml
    port: 7681
    healthcheck: /
    spec: 1vcpu-1gb              # created at 1GB (QA.md: "512 MB is not enough for an agent CLI")
    # A volume makes scale-to-zero a cold boot, not a resume (24.5s measured).
    alwaysOn: true
    volume:
      size: 1
    env:
      fixed:
        HOME: /data/home
      required:
        # Defaults, not generators: the resolution order is provided -> generate -> default, so a
        # `generate:` here would always win and the default could never be seen. These are meant to
        # be read and changed on the deploy form, which is the point.
        ADMIN_USERNAME:
          default: admin
          editable: true
          description: "Username for the browser terminal sign-in"
        ADMIN_PASSWORD:
          default: "123456"
          editable: true
          description: "Password for the browser terminal sign-in. This default is the same for every deploy; change it before sharing the URL"
      optional:
        OPENAI_API_KEY:
          description: "OpenAI API key. Leave blank and run `codex login` in the terminal instead"

meta:
  name: Codex
  tagline: OpenAI's lightweight coding agent in a browser terminal
  category: ai-agent
  tags: [ai-agent, ai]
  logo: ./logo.svg
  links:
    upstream: https://github.com/openai/codex
