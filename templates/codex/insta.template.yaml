code: codex
version: 0.6.1
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: openai/codex
  package: "@openai/codex"
  pinned: "0.148.0"
  license: Apache-2.0

services:
  # Named for the template, not "workspace": three templates sharing one service name collided on
  # the same branch, the second overwriting the first (QA.md finding 1).
  codex:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/codex:0.6.1   # built from ./Dockerfile by templates-build-images.yml
    port: 7681
    healthcheck: /
    spec: 1vcpu-1gb              # created at 1GB (QA.md: "512 MB is not enough for an agent CLI")
    # A volume makes scale-to-zero a cold boot, not a resume (24.5s measured).
    alwaysOn: true
    volume:
      size: 1
    env:
      fixed:
        HOME: /data/home
      required:
        # Neither a `default:` nor a `generate:`, so the deploy form shows two empty required fields
        # and cannot be submitted until the operator fills them. That is deliberate: this service is
        # a root shell in a browser, and a credential shipped in this file would be the same one on
        # every deploy in the world. Nothing here can be left to a fallback.
        ADMIN_USERNAME:
          description: "Username for the browser terminal sign-in"
        ADMIN_PASSWORD:
          description: "Password for the browser terminal sign-in"
      optional:
        OPENAI_API_KEY:
          description: "OpenAI API key. Leave blank and run `codex login` in the terminal instead"

meta:
  name: Codex
  tagline: OpenAI's lightweight coding agent in a browser terminal
  category: ai-agent
  tags: [ai-agent, ai]
  logo: ./logo.svg
  links:
    upstream: https://github.com/openai/codex
