code: openclaw
version: 0.1.0
maintainer: official
sourceRepo: InsForge/insta-oss

# Wraps the official image only to replace the CMD (see ./Dockerfile); everything else is stock.
upstream:
  repo: openclaw/openclaw
  image: ghcr.io/openclaw/openclaw
  pinned: "latest@sha256:2f5ce8848a1a69b3c460622e566cb9395da9fd18d7ef7b038cd8e2c4f195decf"
  license: MIT

generated:
  gateway_token: secret:32

services:
  openclaw:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/openclaw:0.1.0   # built from ./Dockerfile by templates-build-images.yml
    port: 8080
    healthcheck: /startupz
    # Mirrors upstream's fly.toml sizing: 2 vCPU / 2 GB with the node heap capped below the ceiling.
    spec: 2vcpu-2gb
    # Channel connections (Telegram, Discord, ...) run inside the process; an idle machine never wakes for them.
    alwaysOn: true
    volume:
      size: 1
    env:
      fixed:
        OPENCLAW_STATE_DIR: /data/.openclaw
        OPENCLAW_WORKSPACE_DIR: /data/workspace
        # entrypoint.sh seeds this into gateway.controlUi.allowedOrigins before start.
        OPENCLAW_PUBLIC_URL: ${services.openclaw.url}
        NODE_OPTIONS: --max-old-space-size=1536
      generated:
        OPENCLAW_GATEWAY_TOKEN: ${gateway_token}

meta:
  name: OpenClaw
  tagline: Self-hosted personal AI assistant, reachable from your chat apps
  category: ai-agent
  tags: [ai-agent, ai]
  logo: ./logo.svg
  draft: true
  links:
    upstream: https://github.com/openclaw/openclaw
