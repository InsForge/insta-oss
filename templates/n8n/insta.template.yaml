code: n8n
version: 1.1.0
maintainer: official
sourceRepo: InsForge/insta-oss

# Sustainable Use License: reference the official image only, and never rebuild or rebrand it.
upstream:
  repo: n8n-io/n8n
  image: docker.io/n8nio/n8n
  pinned: "2.36.5"
  license: LicenseRef-n8n-Sustainable-Use-License

generated:
  encryption_key: secret:32

services:
  n8n:
    type: web
    image: docker.io/n8nio/n8n:2.36.5
    port: 5678
    healthcheck: /healthz
    # Measured on prod: 557 MB resident while idle, before a single workflow runs.
    spec: 2vcpu-2gb
    # Schedule and polling triggers fire from inside the process, so an idle machine never wakes.
    alwaysOn: true
    # n8n defaults to SQLite, and N8N_USER_FOLDER below puts that file on this volume.
    volume:
      size: 1
    env:
      fixed:
        N8N_USER_FOLDER: /data
        N8N_PORT: "5678"
        N8N_LISTEN_ADDRESS: 0.0.0.0
        N8N_PROXY_HOPS: "1"
        N8N_WEBHOOK_URL: ${services.n8n.url}
        N8N_EDITOR_BASE_URL: ${services.n8n.url}
      generated:
        N8N_ENCRYPTION_KEY: ${encryption_key}

meta:
  name: n8n
  tagline: Visual workflow automation with 400+ integrations
  category: automation
  tags: [automation, ai]
  logo: ./logo.svg
  # Held back on the platform's first-deploy budget, not on anything in this manifest. A first
  # deploy has 60s to answer on its port and the clock starts before the image is pulled; this
  # 2 GB image measured 47s of create-plus-pull, so 3 of 6 cold deploys failed and the machine
  # was destroyed each time. A retry is another FIRST deploy on the same 60s, so it only passes
  # when the host happens to have the image warm. Undraft once insta-platform#270 lands.
  draft: true
  links:
    upstream: https://github.com/n8n-io/n8n
    documentation: https://docs.n8n.io
