code: deepseek-hermes
version: 1.1.1
maintainer: official
sourceRepo: InsForge/insta-oss

# Same upstream image as hermes: a variant is just different defaults, so it costs almost nothing
upstream:
  repo: NousResearch/hermes-agent
  image: docker.io/nousresearch/hermes-agent
  pinned: v2026.8.16
  license: MIT

generated:
  gateway_token: secret:64

services:
  hermes:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/deepseek-hermes:1.1.1   # built from ./Dockerfile by templates-build-images.yml
    port: 8080
    healthcheck: /api/status
    volume:
      size: 1
    env:
      fixed:
        HERMES_HOME: /data/.hermes
        HERMES_DASHBOARD_PORT: "8080"
        HERMES_DEFAULT_MODEL: deepseek/deepseek-chat   # unconfirmed: upstream documents no env names (QA.md: "no provider `oneOf` constraint")
      generated:
        HERMES_GATEWAY_TOKEN: ${gateway_token}
      required:
        ACCESS_PASSWORD:
          description: "Password for the web dashboard (username: admin). Generated if left blank"
          generate: secret:16
          editable: true
        OPENROUTER_API_KEY:
          description: "OpenRouter API key (openrouter.ai/keys). DeepSeek models are served through OpenRouter"
        TELEGRAM_BOT_TOKEN:
          description: "Telegram bot token, created with @BotFather"
        TELEGRAM_ALLOWED_USERS:
          description: "Comma-separated Telegram usernames allowed to use the bot"

meta:
  name: DeepSeek Hermes
  tagline: Hermes Agent preconfigured for DeepSeek models
  category: ai-agent
  tags: [ai-agent, ai]
  logo: ./logo.svg
  links:
    upstream: https://github.com/NousResearch/hermes-agent
    documentation: https://hermes-agent.nousresearch.com/docs/
