# The auth gate in front of the harness web UI, which ships no authentication of its own.
# Only this server faces the network; dsh stays on 127.0.0.1.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    # WebSocket carries the two server-to-browser event streams the UI needs to render a turn.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream harness {
        server 127.0.0.1:3080;
    }

    server {
        listen 0.0.0.0:8080;

        # dsh accepts base64 image attachments in the RPC body; nginx defaults to 1m.
        client_max_body_size 64m;

        auth_basic "DeepSeek Harness";
        auth_basic_user_file /run/dsh/htpasswd;

        location / {
            proxy_pass http://harness;
            proxy_http_version 1.1;

            # Load-bearing. The /api browser-trust fence pins the settings, credential and
            # model-discovery RPCs to a loopback Host with a same-origin Origin, and no
            # --trusted-host value can unlock them (they are checked against an empty trust
            # list). Normalizing both to the upstream authority is what gets those RPCs past
            # the fence. It is only half of what the Settings and Models pages need: the
            # browser runs the same loopback test against the page's own location.hostname,
            # and the Dockerfile is where that second one is dealt with.
            proxy_set_header Host 127.0.0.1:3080;
            proxy_set_header Origin http://127.0.0.1:3080;

            # Sec-Fetch-Site is passed through untouched on purpose: the fence rejects
            # cross-site, and browsers attach basic-auth credentials to cross-site requests
            # automatically, so that rejection is the CSRF defence we are relying on.

            # The gate credential is ours, not the app's.
            proxy_set_header Authorization "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Agent turns stream for minutes; buffering or a short read timeout truncates them.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
